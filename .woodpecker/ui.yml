when:
  - event: push
    branch: master
    path:
      include:
        - .woodpecker/ui.yml
        - Dockerfile
        - nginx.conf
        - package.json
        - package-lock.json
        - angular.json
        - tsconfig.json
        - tsconfig.app.json
        - src/**
        - public/**
  - event: manual

steps:
  - name: build-ui
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ghcr.io/siberianbearofficial/studiogalaxy-ui
      registry: ghcr.io
      username: siberianbearofficial
      password:
        from_secret: GITHUB_TOKEN
      context: .
      dockerfile: Dockerfile
      tag: latest
