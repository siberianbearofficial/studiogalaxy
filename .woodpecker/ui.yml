when:
  - event: push
    branch: master
    path:
      include:
        - .woodpecker/ui.yml
        - frontend/**
  - event: manual

steps:
  - name: build-ui
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ghcr.io/siberianbearofficial/studiogalaxy-ui
      registry: ghcr.io
      username: siberianbearofficial
      password:
        from_secret: GITHUB_TOKEN
      context: frontend
      dockerfile: frontend/Dockerfile
      tag: latest
