server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие текстовых ресурсов
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Хешированные бандлы Angular (outputHashing: all) — можно кэшировать навсегда
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Картинки/шрифты/иконки из public — умеренный кэш (имена не хешируются)
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаём через index.html (роуты /, /cart и т.д.),
    # сам index.html не кэшируем, чтобы новый деплой подхватывался сразу
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
